name: Android CI/CD

on:
  push:
    tags:
      - deploy/android/*
  workflow_dispatch:

jobs:
  build-and-deploy-android-app:
    name: Build and Deploy Android App
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Detect selected app
        id: detect_app_early
        run: |
          set -euo pipefail
          if [[ -f scripts/.selected-app ]]; then
            app=$(tr -d '\r\n' < scripts/.selected-app)
          else
            app="EspaceCo"
          fi
          echo "Selected app: $app"
          echo "SELECTED_APP=$app" >> "$GITHUB_ENV"

      - name: Create empty .env
        run: touch .env

      - name: Make envfile (override with secrets)
        run: |
          set -euo pipefail
          # Set COLLAB_API_CLIENT_ID and COLLAB_API_CLIENT_SECRET based on selected app
          if [[ "$SELECTED_APP" == "NaviForest" ]]; then
            [ -n "${{ secrets.VITE_OAUTH_ANDROID_REDIRECT_URI_NAVIFOREST }}" ] && echo "OAUTH_ANDROID_REDIRECT_URI=${{ secrets.VITE_OAUTH_ANDROID_REDIRECT_URI_NAVIFOREST }}" >> .env || true
            [ -n "${{ secrets.VITE_OAUTH_CLIENT_ID_NAVIFOREST }}" ] && echo "OAUTH_CLIENT_ID=${{ secrets.VITE_OAUTH_CLIENT_ID_NAVIFOREST }}" >> .env || true
          else
            [ -n "${{ secrets.VITE_OAUTH_ANDROID_REDIRECT_URI_ESPACECO }}" ] && echo "OAUTH_ANDROID_REDIRECT_URI=${{ secrets.VITE_OAUTH_ANDROID_REDIRECT_URI_ESPACECO }}" >> .env || true
            [ -n "${{ secrets.VITE_OAUTH_CLIENT_ID_ESPACECO }}" ] && echo "OAUTH_CLIENT_ID=${{ secrets.VITE_OAUTH_CLIENT_ID_ESPACECO }}" >> .env || true
          fi
          # Other secrets (not app-dependent)
          [ -n "${{ secrets.VITE_OAUTH_BASE_URL }}" ] && echo "OAUTH_BASE_URL=${{ secrets.VITE_OAUTH_BASE_URL }}" >> .env || true
          [ -n "${{ secrets.VITE_BASE_API_URL }}" ] && echo "BASE_API_URL=${{ secrets.VITE_BASE_API_URL }}" >> .env || true
          # App selection/name identifiers (optional overrides, defined in the config.js files)
          [ -n "${{ secrets.VITE_APPLI }}" ] && echo "APPLI=${{ secrets.VITE_APPLI }}" >> .env || true
          [ -n "${{ secrets.VITE_APPLI_ID }}" ] && echo "APPLI_ID=${{ secrets.VITE_APPLI_ID }}" >> .env || true
          [ -n "${{ secrets.VITE_APPLI_NAME }}" ] && echo "APPLI_NAME=${{ secrets.VITE_APPLI_NAME }}" >> .env || true

          # DEBUG: remove this block after verifying secrets
          echo "::group::DEBUG - Generated .env"
          echo "SELECTED_APP=$SELECTED_APP"
          if [[ ! -s .env ]]; then
            echo "WARNING: .env is empty (no secrets were written)"
          else
            echo "--- full .env ---"
            cat .env
            echo "--- per-variable summary ---"
            while IFS= read -r line || [[ -n "$line" ]]; do
              [[ -z "$line" || "$line" =~ ^# ]] && continue
              key="${line%%=*}"
              value="${line#*=}"
              echo "$key (length: ${#value})"
            done < .env
          fi
          echo "::endgroup::"

      - name: Install dependencies
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Generate Capacitor assets (Android)
        run: npx @capacitor/assets generate --android

      - name: Capacitor sync (Android)
        run: npx cap sync android

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: 21

      - name: Check Android build-tools
        run: |
          ls -la /usr/local/lib/android/sdk/build-tools/ || true

      - name: Set Android signing params
        id: set_signing_params
        shell: bash
        run: |
          set -euo pipefail
          # Choose alias + key password per selected app
          if [[ "$SELECTED_APP" == "NaviForest" ]]; then
            echo "SIGNING_KEY=${{ secrets.SIGNING_KEY_NAVIFOREST }}" >> "$GITHUB_ENV"
            echo "SIGNING_ALIAS=${{ secrets.ALIAS_NAVIFOREST }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.KEY_PASSWORD_NAVIFOREST }}" >> "$GITHUB_ENV"
          else
            echo "SIGNING_KEY=${{ secrets.SIGNING_KEY_ESPACECO }}" >> "$GITHUB_ENV"
            echo "SIGNING_ALIAS=${{ secrets.ALIAS_ESPACECO }}" >> "$GITHUB_ENV"
            echo "SIGNING_KEY_PASSWORD=${{ secrets.KEY_PASSWORD_ESPACECO }}" >> "$GITHUB_ENV"
          fi
          # Derive package name from updated Gradle config
          pkg=$(sed -n 's/.*applicationId\s*"\([^"]*\)".*/\1/p' android/app/build.gradle | head -n1)
          if [[ -n "$pkg" ]]; then
            echo "PACKAGE_NAME=$pkg" >> "$GITHUB_ENV"
          fi

      - name: Build Android release (APK + AAB)
        run: |
          cd android
          ./gradlew --no-daemon assembleRelease bundleRelease

      - name: Sign Android App Bundle (AAB)
        id: sign_aab
        uses: r0adkll/sign-android-release@v1
        with:
          # Sign the generated AAB in the release output directory
          releaseDirectory: android/app/build/outputs/bundle/release
          signingKeyBase64: ${{ env.SIGNING_KEY }}
          alias: ${{ env.SIGNING_ALIAS }}
          keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
          keyPassword: ${{ env.SIGNING_KEY_PASSWORD }}
        env:
          BUILD_TOOLS_VERSION: "34.0.0"

      - name: Upload signed bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: android-signed-aab
          path: ${{ steps.sign_aab.outputs.signedReleaseFile }}
          retention-days: 3

      - name: Deploy to Play Store (internal track)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.SERVICE_ACCOUNT_JSON }}
          packageName: ${{ env.PACKAGE_NAME }}
          releaseFiles: ${{ steps.sign_aab.outputs.signedReleaseFile }}
          track: internal
          status: completed
          inAppUpdatePriority: 5
